<svg width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="倒回到開始" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <title>倒回到開始</title>
  <!-- 左邊的垂直條 (代表「到開始」) -->
  <rect x="2" y="6" width="4" height="20" rx="1" fill="#fff"/>
  <!-- 左邊的三角 (第一個左箭頭) -->
  <polygon points="8,16 18,6 18,26" fill="#fff"/>
  <!-- 右邊的三角 (第二個左箭頭) -->
  <polygon points="18,16 28,6 28,26" fill="#fff"/>
</svg>
